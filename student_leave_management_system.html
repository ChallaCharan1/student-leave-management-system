<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Leave Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext } = React;

        // --- MOCK POSTGRESQL & BACKEND SIMULATION STORE ---
        const INITIAL_DEPARTMENTS = [
            { id: 1, name: 'Computer Science & Engineering', code: 'CSE', hod_id: 3 },
            { id: 2, name: 'Electronics & Communication', code: 'ECE', hod_id: 4 },
            { id: 3, name: 'Mechanical Engineering', code: 'MECH', hod_id: 5 }
        ];

        const INITIAL_USERS = [
            { id: 1, name: 'Alex Johnson', email: 'student@example.com', password_hash: '$2b$10$hashed_student_pass', role: 'STUDENT', student_id: 'CS2026-089', department_id: 1, created_at: '2026-01-10T08:00:00Z' },
            { id: 2, name: 'Prof. Sarah Jenkins', email: 'faculty@example.com', password_hash: '$2b$10$hashed_faculty_pass', role: 'FACULTY', student_id: null, department_id: 1, created_at: '2025-08-15T09:30:00Z' },
            { id: 3, name: 'Dr. Robert Miller', email: 'hod@example.com', password_hash: '$2b$10$hashed_hod_pass', role: 'HOD', student_id: null, department_id: 1, created_at: '2024-03-01T10:00:00Z' },
            { id: 4, name: 'Samantha Reed', email: 'student2@example.com', password_hash: '$2b$10$hashed_student2_pass', role: 'STUDENT', student_id: 'EC2026-014', department_id: 2, created_at: '2026-02-01T08:00:00Z' }
        ];

        const INITIAL_LEAVES = [
            {
                id: 101,
                student_id: 1,
                department_id: 1,
                from_date: '2026-10-12',
                to_date: '2026-10-14',
                number_of_days: 3,
                leave_type: 'Casual Leave',
                reason: 'Attending cousin wedding ceremony in hometown.',
                faculty_status: 'APPROVED',
                faculty_comment: 'Recommended based on academic attendance history.',
                faculty_action_at: '2026-10-02T11:20:00Z',
                hod_status: 'APPROVED',
                hod_comment: 'Approved. Make up missed lab work upon return.',
                hod_action_at: '2026-10-03T14:15:00Z',
                final_status: 'APPROVED',
                created_at: '2026-10-01T09:00:00Z',
                updated_at: '2026-10-03T14:15:00Z'
            },
            {
                id: 102,
                student_id: 1,
                department_id: 1,
                from_date: '2026-10-18',
                to_date: '2026-10-20',
                number_of_days: 3,
                leave_type: 'Medical Leave',
                reason: 'Severe viral fever and physician recommended bed rest.',
                faculty_status: 'APPROVED',
                faculty_comment: 'Medical certificate attached and verified.',
                faculty_action_at: '2026-10-05T08:30:00Z',
                hod_status: 'PENDING',
                hod_comment: null,
                hod_action_at: null,
                final_status: 'HOD_PENDING',
                created_at: '2026-10-04T16:45:00Z',
                updated_at: '2026-10-05T08:30:00Z'
            },
            {
                id: 103,
                student_id: 1,
                department_id: 1,
                from_date: '2026-10-25',
                to_date: '2026-10-26',
                number_of_days: 2,
                leave_type: 'Emergency Leave',
                reason: 'Urgent family emergency requirement.',
                faculty_status: 'PENDING',
                faculty_comment: null,
                faculty_action_at: null,
                hod_status: 'PENDING',
                hod_comment: null,
                hod_action_at: null,
                final_status: 'FACULTY_PENDING',
                created_at: '2026-10-06T07:12:00Z',
                updated_at: '2026-10-06T07:12:00Z'
            }
        ];

        // Global Context
        const AppContext = createContext();

        function App() {
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('slms_users')) || INITIAL_USERS);
            const [leaves, setLeaves] = useState(() => JSON.parse(localStorage.getItem('slms_leaves')) || INITIAL_LEAVES);
            const [departments] = useState(INITIAL_DEPARTMENTS);
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sqlLogs, setSqlLogs] = useState([]);
            const [notifications, setNotifications] = useState([]);
            const [activeView, setActiveView] = useState('app'); // 'app' or 'code'

            useEffect(() => {
                localStorage.setItem('slms_users', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('slms_leaves', JSON.stringify(leaves));
            }, [leaves]);

            const logSQL = (query, params = []) => {
                const timestamp = new Date().toLocaleTimeString();
                setSqlLogs(prev => [{ id: Date.now(), query, params, timestamp }, ...prev.slice(0, 49)]);
            };

            const addNotification = (message, type = 'info') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 4000);
            };

            // Authentication API Handler
            const login = (email, password) => {
                logSQL("SELECT * FROM users WHERE email = $1 LIMIT 1;", [email]);
                const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());
                if (user) {
                    // Password verification simulated
                    setCurrentUser(user);
                    setActiveTab('dashboard');
                    addNotification(`Welcome back, ${user.name}! Connected as ${user.role}.`, 'success');
                    return { success: true, user };
                }
                return { success: false, message: 'Invalid credentials provided.' };
            };

            const logout = () => {
                setCurrentUser(null);
                addNotification('Logged out successfully from session.', 'info');
            };

            // Calculate leave days helper
            const calculateDays = (start, end) => {
                if (!start || !end) return 0;
                const s = new Date(start);
                const e = new Date(end);
                const diffTime = e.getTime() - s.getTime();
                if (diffTime < 0) return 0;
                return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            };

            // Leave Submission Action
            const submitLeave = (leaveData) => {
                const days = calculateDays(leaveData.fromDate, leaveData.toDate);
                if (days <= 0) {
                    addNotification('From date cannot be after To date!', 'error');
                    return false;
                }

                // Check overlap
                const overlap = leaves.some(l => 
                    l.student_id === currentUser.id && 
                    l.final_status !== 'REJECTED' &&
                    ((leaveData.fromDate >= l.from_date && leaveData.fromDate <= l.to_date) ||
                     (leaveData.toDate >= l.from_date && leaveData.toDate <= l.to_date))
                );

                if (overlap) {
                    addNotification('An active or pending leave application already exists for these dates.', 'error');
                    return false;
                }

                const newLeave = {
                    id: Date.now(),
                    student_id: currentUser.id,
                    department_id: currentUser.department_id,
                    from_date: leaveData.fromDate,
                    to_date: leaveData.toDate,
                    number_of_days: days,
                    leave_type: leaveData.leaveType,
                    reason: leaveData.reason,
                    faculty_status: 'PENDING',
                    faculty_comment: null,
                    faculty_action_at: null,
                    hod_status: 'PENDING',
                    hod_comment: null,
                    hod_action_at: null,
                    final_status: 'FACULTY_PENDING',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };

                logSQL(`INSERT INTO leave_applications (student_id, department_id, from_date, to_date, number_of_days, leave_type, reason, final_status) VALUES ($1, $2, $3, $4, $5, $6, $7, 'FACULTY_PENDING') RETURNING *;`, 
                    [currentUser.id, currentUser.department_id, leaveData.fromDate, leaveData.toDate, days, leaveData.leaveType, leaveData.reason]);

                setLeaves(prev => [newLeave, ...prev]);
                addNotification('Leave application submitted successfully. Current Status: FACULTY_PENDING', 'success');
                setActiveTab('history');
                return true;
            };

            // Faculty Actions
            const facultyApprove = (leaveId, comment) => {
                logSQL(`UPDATE leave_applications SET faculty_status = 'APPROVED', faculty_comment = $1, faculty_action_at = NOW(), final_status = 'HOD_PENDING', updated_at = NOW() WHERE id = $2;`, [comment, leaveId]);
                
                setLeaves(prev => prev.map(l => {
                    if (l.id === leaveId) {
                        return {
                            ...l,
                            faculty_status: 'APPROVED',
                            faculty_comment: comment || 'Faculty recommendation recorded.',
                            faculty_action_at: new Date().toISOString(),
                            final_status: 'HOD_PENDING',
                            updated_at: new Date().toISOString()
                        };
                    }
                    return l;
                }));
                addNotification('Leave application approved & forwarded to HOD for final sign-off.', 'success');
            };

            const facultyReject = (leaveId, comment) => {
                if (!comment || !comment.trim()) {
                    addNotification('A rejection reason is strictly required by faculty policy.', 'error');
                    return false;
                }
                logSQL(`UPDATE leave_applications SET faculty_status = 'REJECTED', faculty_comment = $1, faculty_action_at = NOW(), final_status = 'REJECTED', updated_at = NOW() WHERE id = $2;`, [comment, leaveId]);

                setLeaves(prev => prev.map(l => {
                    if (l.id === leaveId) {
                        return {
                            ...l,
                            faculty_status: 'REJECTED',
                            faculty_comment: comment,
                            faculty_action_at: new Date().toISOString(),
                            final_status: 'REJECTED',
                            updated_at: new Date().toISOString()
                        };
                    }
                    return l;
                }));
                addNotification('Leave application marked as REJECTED by Faculty.', 'info');
                return true;
            };

            // HOD Actions
            const hodApprove = (leaveId, comment) => {
                logSQL(`UPDATE leave_applications SET hod_status = 'APPROVED', hod_comment = $1, hod_action_at = NOW(), final_status = 'APPROVED', updated_at = NOW() WHERE id = $2;`, [comment, leaveId]);

                setLeaves(prev => prev.map(l => {
                    if (l.id === leaveId) {
                        return {
                            ...l,
                            hod_status: 'APPROVED',
                            hod_comment: comment || 'HOD final authorization granted.',
                            hod_action_at: new Date().toISOString(),
                            final_status: 'APPROVED',
                            updated_at: new Date().toISOString()
                        };
                    }
                    return l;
                }));
                addNotification('Leave application FINAL APPROVED.', 'success');
            };

            const hodReject = (leaveId, comment) => {
                if (!comment || !comment.trim()) {
                    addNotification('A rejection reason is strictly required by HOD policy.', 'error');
                    return false;
                }
                logSQL(`UPDATE leave_applications SET hod_status = 'REJECTED', hod_comment = $1, hod_action_at = NOW(), final_status = 'REJECTED', updated_at = NOW() WHERE id = $2;`, [comment, leaveId]);

                setLeaves(prev => prev.map(l => {
                    if (l.id === leaveId) {
                        return {
                            ...l,
                            hod_status: 'REJECTED',
                            hod_comment: comment,
                            hod_action_at: new Date().toISOString(),
                            final_status: 'REJECTED',
                            updated_at: new Date().toISOString()
                        };
                    }
                    return l;
                }));
                addNotification('Leave application FINAL REJECTED by HOD.', 'info');
                return true;
            };

            return (
                <AppContext.Provider value={{
                    users, leaves, departments, currentUser, activeTab, setActiveTab,
                    login, logout, submitLeave, facultyApprove, facultyReject, hodApprove, hodReject,
                    sqlLogs, calculateDays, activeView, setActiveView
                }}>
                    <div className="flex flex-col min-h-screen bg-slate-900 text-slate-100">
                        {/* Top System Navigation Header */}
                        <header className="bg-slate-800 border-b border-slate-700 px-4 py-3 flex flex-wrap justify-between items-center z-20">
                            <div className="flex items-center space-x-3">
                                <div className="bg-indigo-600 p-2 rounded-lg text-white font-bold flex items-center justify-center w-10 h-10 shadow-lg">
                                    <i className="fas fa-graduation-cap text-xl"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight tracking-wide text-white">AcademiaLeave Enterprise</h1>
                                    <p className="text-xs text-slate-400">PostgreSQL + Express.js Web Engine Simulation</p>
                                </div>
                            </div>

                            {/* View Mode Toggle: Application vs Code Inspector */}
                            <div className="flex items-center space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800 my-2 sm:my-0">
                                <button
                                    onClick={() => setActiveView('app')}
                                    className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${
                                        activeView === 'app' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fas fa-desktop"></i>
                                    <span>Interactive Portals</span>
                                </button>
                                <button
                                    onClick={() => setActiveView('code')}
                                    className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1.5 ${
                                        activeView === 'code' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    <i className="fas fa-code"></i>
                                    <span>Project Workspace Files</span>
                                </button>
                            </div>

                            {/* User Status Bar */}
                            {currentUser ? (
                                <div className="flex items-center space-x-3">
                                    <div className="text-right hidden sm:block">
                                        <p className="text-sm font-semibold text-slate-200">{currentUser.name}</p>
                                        <span className={`inline-block text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                            currentUser.role === 'STUDENT' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                                            currentUser.role === 'FACULTY' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' :
                                            'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                        }`}>
                                            {currentUser.role} PORTAL
                                        </span>
                                    </div>
                                    <button
                                        onClick={logout}
                                        className="bg-slate-700 hover:bg-rose-600 text-slate-200 hover:text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-colors flex items-center space-x-1"
                                    >
                                        <i className="fas fa-sign-out-alt"></i>
                                        <span>Logout</span>
                                    </button>
                                </div>
                            ) : (
                                <span className="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full flex items-center space-x-1">
                                    <i className="fas fa-key text-[10px]"></i>
                                    <span>Authentication Required</span>
                                </span>
                            )}
                        </header>

                        {/* Notifications Overlay */}
                        <div className="fixed top-16 right-4 z-50 flex flex-col space-y-2 max-w-sm pointer-events-none">
                            {notifications.map(n => (
                                <div
                                    key={n.id}
                                    className={`pointer-events-auto p-3 rounded-lg shadow-xl text-xs font-medium flex items-center justify-between border ${
                                        n.type === 'success' ? 'bg-emerald-900/90 text-emerald-100 border-emerald-600' :
                                        n.type === 'error' ? 'bg-rose-900/90 text-rose-100 border-rose-600' :
                                        'bg-sky-900/90 text-sky-100 border-sky-600'
                                    }`}
                                >
                                    <span className="mr-2">{n.message}</span>
                                    <i className={`fas ${
                                        n.type === 'success' ? 'fa-check-circle' : n.type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'
                                    }`}></i>
                                </div>
                            ))}
                        </div>

                        {/* Main Interface Content */}
                        <div className="flex-1 flex flex-col">
                            {activeView === 'app' ? (
                                currentUser ? <PortalLayout /> : <LoginScreen />
                            ) : (
                                <ProjectCodeExplorer />
                            )}
                        </div>

                        {/* Database Query Inspector Footer Log */}
                        <DatabaseInspector logs={sqlLogs} />
                    </div>
                </AppContext.Provider>
            );
        }

        function LoginScreen() {
            const { login } = useContext(AppContext);
            const [email, setEmail] = useState('student@example.com');
            const [password, setPassword] = useState('password123');

            const handleSubmit = (e) => {
                e.preventDefault();
                login(email, password);
            };

            const selectDemoAccount = (accEmail) => {
                setEmail(accEmail);
                login(accEmail, 'password123');
            };

            return (
                <div className="flex-1 flex items-center justify-center p-4 bg-slate-950 relative overflow-hidden">
                    {/* Background glow effects */}
                    <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

                    <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 z-10">
                        <div className="text-center mb-6">
                            <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-3 border border-indigo-500/30">
                                <i className="fas fa-university text-2xl"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-white tracking-tight">Portal Single Sign-On</h2>
                            <p className="text-xs text-slate-400 mt-1">Student Leave Management System System Authenticator</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-300 mb-1">Institutional Email</label>
                                <div className="relative">
                                    <i className="fas fa-envelope absolute left-3 top-3 text-slate-500 text-xs"></i>
                                    <input
                                        type="email"
                                        required
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors"
                                        placeholder="user@college.edu"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                                <div className="relative">
                                    <i className="fas fa-lock absolute left-3 top-3 text-slate-500 text-xs"></i>
                                    <input
                                        type="password"
                                        required
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors"
                                        placeholder="••••••••"
                                    />
                                </div>
                            </div>

                            <button
                                type="submit"
                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2"
                            >
                                <span>Sign In to Dashboard</span>
                                <i className="fas fa-arrow-right text-xs"></i>
                            </button>
                        </form>

                        <div className="mt-8 pt-6 border-t border-slate-800">
                            <p className="text-xs font-semibold text-slate-400 mb-3 text-center uppercase tracking-wider">Quick Demo Login Shortcuts</p>
                            <div className="grid grid-cols-3 gap-2">
                                <button
                                    onClick={() => selectDemoAccount('student@example.com')}
                                    className="p-2.5 bg-slate-800/80 hover:bg-blue-600/20 hover:border-blue-500/50 border border-slate-700 rounded-xl transition-all text-center group"
                                >
                                    <i className="fas fa-user-graduate text-blue-400 group-hover:scale-110 transition-transform mb-1 block"></i>
                                    <span className="text-[11px] font-medium text-slate-300 block">Student</span>
                                </button>
                                <button
                                    onClick={() => selectDemoAccount('faculty@example.com')}
                                    className="p-2.5 bg-slate-800/80 hover:bg-purple-600/20 hover:border-purple-500/50 border border-slate-700 rounded-xl transition-all text-center group"
                                >
                                    <i className="fas fa-chalkboard-teacher text-purple-400 group-hover:scale-110 transition-transform mb-1 block"></i>
                                    <span className="text-[11px] font-medium text-slate-300 block">Faculty</span>
                                </button>
                                <button
                                    onClick={() => selectDemoAccount('hod@example.com')}
                                    className="p-2.5 bg-slate-800/80 hover:bg-emerald-600/20 hover:border-emerald-500/50 border border-slate-700 rounded-xl transition-all text-center group"
                                >
                                    <i className="fas fa-user-shield text-emerald-400 group-hover:scale-110 transition-transform mb-1 block"></i>
                                    <span className="text-[11px] font-medium text-slate-300 block">HOD</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PortalLayout() {
            const { currentUser, activeTab, setActiveTab } = useContext(AppContext);

            const studentNav = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'apply', label: 'Apply Leave', icon: 'fa-paper-plane' },
                { id: 'history', label: 'My Applications', icon: 'fa-history' },
                { id: 'profile', label: 'My Profile', icon: 'fa-user-circle' }
            ];

            const facultyNav = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'pending', label: 'Pending Approvals', icon: 'fa-clock' },
                { id: 'history', label: 'All Reviews', icon: 'fa-list-check' }
            ];

            const hodNav = [
                { id: 'dashboard', label: 'Department Analytics', icon: 'fa-chart-bar' },
                { id: 'pending', label: 'HOD Approvals', icon: 'fa-signature' },
                { id: 'all_leaves', label: 'Department Leaves', icon: 'fa-building' }
            ];

            const currentNav = currentUser.role === 'STUDENT' ? studentNav :
                              currentUser.role === 'FACULTY' ? facultyNav : hodNav;

            return (
                <div className="flex-1 flex flex-col md:flex-row bg-slate-950">
                    {/* Sidebar Navigation */}
                    <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0">
                        <div className="p-4">
                            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider px-3 mb-3">
                                {currentUser.role} Menu
                            </div>
                            <nav className="space-y-1">
                                {currentNav.map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setActiveTab(item.id)}

        function StatusBadge({ status }) {
            if (status === 'APPROVED') {

                return <span className="bg-purple-500/10 border border-purple-500/30 text-purple-400 text-[10px] font-bold px-2 py-0.5 rounded-full inline-flex items-center"><i className="fas fa-clock mr-1"></i>HOD Pending</span>;

            return <span className="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-full inline-flex items-center"><i className="fas fa-clock mr-1"></i>Faculty Pending</span>;

        function LeaveTable({ leaves, showStudent = false, users = [] }) {

            const [isOpen, setIsOpen] = useState(false);

            return (
                <div className="border-t border-slate-800 bg-slate-950">
                    <button
                        onClick={() => setIsOpen(!isOpen)}

                    >
                        <span className="flex items-center space-x-2">
                            <i className="fas fa-database text-indigo-400"></i>
                            <span className="font-semibold font-mono">PostgreSQL Live Query Engine Inspector</span>
                            <span className="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full">{logs.length} Queries Handled</span>
                        </span>
                        <i className={`fas fa-chevron-${isOpen ? 'down' : 'up'}`}></i>
                    </button>

                    {isOpen && (
                        <div className="h-48 overflow-y-auto p-4 font-mono text-[11px] bg-slate-950 text-slate-300 space-y-2 custom-scrollbar border-t border-slate-800">
                            {logs.length === 0 ? (
                                <p className="text-slate-600 italic">No SQL statements executed yet. Interact with portals to stream queries...</p>

                                ))
                            )}
                        </div>

                </div>
            );
        }

## Project Overview
A production-grade, multi-tenant academic web application designed to digitize, streamline, and audit college leave applications across Students, Faculty, and Heads of Departments (HOD).

## Workflow Architecture
Student Submission -> Faculty Endorsement (FACULTY_PENDING) -> HOD Final Authorization (HOD_PENDING) -> Approved / Rejected

## Tech Stack
- Frontend: React.js, Tailwind CSS, Axios, Lucide/FontAwesome
- Backend: Node.js, Express.js REST API
- Security: JWT Tokens, bcrypt hashing, Role RBAC Middleware
- Database: PostgreSQL Relational Database with Foreign Key constraints

## Local Setup
1. Setup PostgreSQL: \`psql -U postgres -f database/schema.sql\`
2. Seed Initial Data: \`psql -U postgres -f database/seed.sql\`
3. Run Backend: \`cd server && npm install && npm run dev\`
4. Run Frontend: \`cd client && npm install && npm start\`

## Demo Credentials
- Student: student@example.com / password123
- Faculty: faculty@example.com / password123
- HOD: hod@example.com / password123`,

                'schema.sql': `-- PostgreSQL Database Schema Definition

DROP TABLE IF EXISTS leave_applications CASCADE;
DROP TABLE IF EXISTS users CASCADE;
DROP TABLE IF EXISTS departments CASCADE;

CREATE TABLE departments (
    id SERIAL PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    code VARCHAR(10) UNIQUE NOT NULL,
    hod_id INT,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE users (
    id SERIAL PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    email VARCHAR(120) UNIQUE NOT NULL,
    password_hash VARCHAR(255) NOT NULL,
    role VARCHAR(20) NOT NULL CHECK (role IN ('STUDENT', 'FACULTY', 'HOD')),
    student_id VARCHAR(30) UNIQUE,
    department_id INT REFERENCES departments(id) ON DELETE CASCADE,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

ALTER TABLE departments ADD CONSTRAINT fk_hod FOREIGN KEY (hod_id) REFERENCES users(id) ON DELETE SET NULL;

CREATE TABLE leave_applications (
    id SERIAL PRIMARY KEY,
    student_id INT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    department_id INT NOT NULL REFERENCES departments(id) ON DELETE CASCADE,
    from_date DATE NOT NULL,
    to_date DATE NOT NULL,
    number_of_days INT NOT NULL CHECK (number_of_days > 0),
    leave_type VARCHAR(50) NOT NULL,
    reason TEXT NOT NULL,
    faculty_status VARCHAR(20) DEFAULT 'PENDING' CHECK (faculty_status IN ('PENDING', 'APPROVED', 'REJECTED')),
    faculty_comment TEXT,
    faculty_action_at TIMESTAMP WITH TIME ZONE,
    hod_status VARCHAR(20) DEFAULT 'PENDING' CHECK (hod_status IN ('PENDING', 'APPROVED', 'REJECTED')),
    hod_comment TEXT,
    hod_action_at TIMESTAMP WITH TIME ZONE,
    final_status VARCHAR(30) DEFAULT 'FACULTY_PENDING' CHECK (final_status IN ('FACULTY_PENDING', 'HOD_PENDING', 'APPROVED', 'REJECTED')),
    created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
    CONSTRAINT check_dates CHECK (to_date >= from_date)
);

CREATE INDEX idx_leave_student ON leave_applications(student_id);
CREATE INDEX idx_leave_dept ON leave_applications(department_id);
CREATE INDEX idx_leave_status ON leave_applications(final_status);`,
